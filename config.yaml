# ───────────────────────────────────────────────────────────────
# 这个文件会进 git。**凭据绝不写在这里** —— webhook URL、应用专用密码
# 全部放 .env(已被 .gitignore 挡掉)。
# ───────────────────────────────────────────────────────────────

delivery:
  # 按「agent 在哪发、你在哪读」选(第 6 幕 / kp-06 的部署决策):
  #   gmail  — 邮件。在国外 / 沙箱在境外时最顺(GFW 挡的是从大陆访问 Google,不挡从境外发信)
  #   feishu — 飞书自定义机器人。在大陆的同学推荐,app 里即时收到
  #   local  — 只写本地文件。没配凭据时的兜底 —— 注意它**过不了 G2 闸**,
  #            因为写本地文件不叫「送到人手上」,也没有任何外部回执
  channel: feishu

verify:
  # G1 分数闸:自报精度和服务端分数差多少算红。
  # 0.02 = 2 个百分点,留给提交抖动,但拦得住「拿训练集精度当测试精度」那种十几二十点的差。
  score_tolerance: 0.02
  # G3 部署闸:最近一次成功运行超过这么多小时就算「曾经跑过但现在不一定还在跑」。
  deploy_max_age_hours: 48

budget:
  # 提醒用,不是硬闸(硬闸在服务端)。每人 $30,全局 $400 封顶。
  # 一次完整微调 10–40 分钟。跑之前先问自己:这一轮我想验证什么?
  gpu_usd_per_learner: 30
